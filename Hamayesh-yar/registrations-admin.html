<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مدیریت ثبت‌نام‌ها | همایش‌یار</title>
<link rel="stylesheet" href="css/app.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/pages.css"><link rel="stylesheet" href="css/responsive.css"><link rel="stylesheet" href="css/layout.css"><link rel="stylesheet" href="css/ui-final.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head><body>
<div id="site-header"></div>
<section class="page-header"><div class="container"><div class="page-header-content"><div><span class="page-badge"><i class="fas fa-users"></i> مدیریت ثبت‌نام‌ها</span><h1>ثبت‌نام‌کنندگان همایش‌ها</h1><p>مشاهده، فیلتر و مدیریت وضعیت حضور شرکت‌کنندگان.</p></div><div><a href="events-admin.html" class="btn btn-secondary"><i class="fas fa-calendar"></i> مدیریت همایش‌ها</a></div></div></div></section>
<main class="page-section"><div class="container">
<div class="card" style="padding:1rem;margin-bottom:1rem;"><div class="form-row"><div class="form-group"><label for="eventFilter">همایش</label><select id="eventFilter"><option value="">همه همایش‌ها</option></select></div><div class="form-group"><label for="statusFilter">وضعیت</label><select id="statusFilter"><option value="">همه</option><option value="registered">ثبت‌نام‌شده</option><option value="attended">حاضر</option><option value="cancelled">لغوشده</option></select></div></div></div>
<div class="card"><div class="card-header"><div class="card-header-left"><i class="fas fa-list"></i><h3>لیست ثبت‌نام‌ها</h3></div><span class="badge badge-primary" id="regCount">۰</span></div><div style="overflow:auto;"><table class="data-table"><thead><tr><th>#</th><th>نام</th><th>ایمیل</th><th>همایش</th><th>تماس</th><th>سازمان</th><th>وضعیت</th><th>تاریخ</th><th>عملیات</th></tr></thead><tbody id="regList"><tr><td colspan="9" style="text-align:center;">در حال بارگذاری…</td></tr></tbody></table></div></div>
</div></main><div id="site-footer"></div>
<script src="js/toast.js"></script><script src="js/app.js"></script><script src="js/layout.js"></script>
<script>
(function(){'use strict';function api(path,opt){return window.apiRequest(path,opt);} function st(x){return x==='registered'?'ثبت‌نام‌شده':x==='attended'?'حاضر':'لغوشده';}
async function loadEvents(){var r=await api('events.php?admin=1',{method:'GET'});if(!r.ok){showToast(r.message||'خطا در دریافت همایش‌ها','error');return;} var sel=document.getElementById('eventFilter');(r.events||[]).forEach(function(e){var o=document.createElement('option');o.value=e.id;o.textContent=e.title;sel.appendChild(o);});}
async function load(){var ev=document.getElementById('eventFilter').value, ss=document.getElementById('statusFilter').value;var q='registrations.php?admin=1';if(ev)q+='&event_id='+encodeURIComponent(ev);if(ss)q+='&status='+encodeURIComponent(ss);var r=await api(q,{method:'GET'});if(!r.ok){showToast(r.message||'دریافت ثبت‌نام‌ها انجام نشد.','error');return;}var rows=r.registrations||[];document.getElementById('regCount').textContent=new Intl.NumberFormat('fa-IR').format(rows.length);document.getElementById('regList').innerHTML=rows.length?rows.map(function(x,i){return '<tr><td>'+new Intl.NumberFormat('fa-IR').format(i+1)+'</td><td><strong>'+esc(x.name)+'</strong></td><td>'+esc(x.email)+'</td><td>'+esc(x.event_title||'—')+'</td><td>'+esc(x.phone||'—')+'</td><td>'+esc(x.organization||'—')+'</td><td>'+st(x.status)+'</td><td>'+esc(x.registered_at||'—')+'</td><td><div style="display:flex;gap:.35rem;flex-wrap:wrap;">'+(x.status!=='attended'?'<button class="btn btn-success btn-sm" data-attend="'+x.id+'"><i class="fas fa-check"></i></button>':'')+(x.status==='registered'?'<button class="btn btn-danger btn-sm" data-cancel="'+x.id+'"><i class="fas fa-ban"></i></button>':'')+'</div></td></tr>';}).join(''):'<tr><td colspan="9" style="text-align:center;">ثبت‌نامی پیدا نشد.</td></tr>';}
function esc(s){return String(s).replace(/[&<>\"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c];});}
document.getElementById('eventFilter').addEventListener('change',load);document.getElementById('statusFilter').addEventListener('change',load);document.getElementById('regList').addEventListener('click',async function(e){var b=e.target.closest('button');if(!b)return;var id=Number(b.dataset.attend||b.dataset.cancel);var status=b.dataset.attend?'attended':'cancelled';if(!confirm(status==='attended'?'حضور این فرد ثبت شود؟':'ثبت‌نام این فرد لغو شود؟'))return;var r=await api('registrations.php',{method:'PATCH',body:JSON.stringify({id:id,status:status})});showToast(r.message||'',r.ok?'success':'error');if(r.ok)load();});
window.addEventListener('DOMContentLoaded',async function(){if(!window.getUser()||!['secretariat','admin'].includes(window.getUser().role)){location.replace('login.html');return;}await loadEvents();load();});})();
</script></body></html>

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>مدیریت برنامه همایش | همایش یار</title>
<link rel="stylesheet" href="css/app.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/pages.css"><link rel="stylesheet" href="css/responsive.css"><link rel="stylesheet" href="css/layout.css"><link rel="stylesheet" href="css/ui-final.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
.schedule-admin-wrap{max-width:1200px;margin:40px auto;padding:0 18px}.admin-card{background:#fff;border:1px solid #e7e4ef;border-radius:18px;padding:22px;box-shadow:0 8px 30px rgba(40,30,80,.06);margin-bottom:20px}.admin-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.admin-grid .full{grid-column:1/-1}.admin-grid input,.admin-grid select,.admin-grid textarea{width:100%;padding:11px 12px;border:1px solid #ddd7ea;border-radius:10px;font:inherit}.admin-grid textarea{min-height:90px}.toolbar{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.schedule-admin-list{display:grid;gap:12px}.schedule-admin-item{display:flex;justify-content:space-between;gap:18px;align-items:center;padding:16px;border:1px solid #ece8f2;border-radius:14px;background:#fcfbff}.schedule-admin-item .meta{font-size:13px;color:#666;display:flex;gap:14px;flex-wrap:wrap}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn-danger{background:#c94b5b!important;color:#fff!important}.muted{color:#777;font-size:13px}@media(max-width:900px){.admin-grid{grid-template-columns:1fr 1fr}}@media(max-width:600px){.admin-grid{grid-template-columns:1fr}.schedule-admin-item{flex-direction:column;align-items:stretch}}
</style></head>
<body><header class="main-header"><div id="navbar-placeholder"></div></header>
<main><section class="page-header"><div class="container"><div class="page-header-content"><div><span class="page-badge"><i class="fas fa-calendar-days"></i> مدیریت برنامه</span><h1>مدیریت برنامه همایش</h1><p>ایجاد، ویرایش و حذف جلسات و ارائه‌های هر همایش.</p></div></div></div></section>
<section class="schedule-admin-wrap"><div class="admin-card"><div class="toolbar"><div style="min-width:260px;flex:1"><label>همایش</label><select id="eventSelect"></select></div><button class="btn btn-outline" onclick="loadItems()"><i class="fas fa-rotate"></i> بروزرسانی</button></div></div>
<div class="admin-card"><h2 id="formTitle">افزودن برنامه</h2><form id="scheduleForm"><input type="hidden" id="itemId"><div class="admin-grid"><div><label>تاریخ</label><input id="date" type="date"></div><div><label>شروع</label><input id="startTime" type="time"></div><div><label>پایان</label><input id="endTime" type="time"></div><div><label>نوع</label><select id="type"><option value="keynote">سخنرانی کلیدی</option><option value="speech">سخنرانی</option><option value="panel">پنل</option><option value="workshop">کارگاه</option><option value="break">استراحت</option></select></div><div class="full"><label>عنوان</label><input id="title" required></div><div><label>سخنران</label><input id="speaker"></div><div><label>سالن</label><input id="hall"></div><div><label>ترتیب</label><input id="sortOrder" type="number" value="0"></div><div class="full"><label>توضیحات</label><textarea id="description"></textarea></div></div><div style="display:flex;gap:10px;margin-top:15px"><button class="btn btn-primary" type="submit">ذخیره</button><button class="btn btn-outline" type="button" onclick="resetForm()">لغو و فرم جدید</button></div></form></div>
<div class="admin-card"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><h2>برنامه‌های این همایش</h2><span class="muted" id="count"></span></div><div class="schedule-admin-list" id="items"></div></div></section></main><div id="site-footer"></div>
<script src="js/toast.js"></script><script src="js/layout.js"></script><script>
var items=[],events=[];
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');}
async function json(url,opt){var r=await fetch(url,Object.assign({credentials:'same-origin',headers:{'Content-Type':'application/json'}},opt||{}));var d=await r.json();if(!r.ok||!d.ok)throw new Error(d.message||'خطا');return d;}
async function loadEvents(){var d=await json('backend/api/events.php?admin=1');events=d.events||[];var s=document.getElementById('eventSelect');s.innerHTML=events.map(function(e){return '<option value="'+e.id+'">'+esc(e.title)+'</option>';}).join('');if(!events.length)s.innerHTML='<option value="">همایشی وجود ندارد</option>';}
async function loadItems(){var id=document.getElementById('eventSelect').value;if(!id)return;var d=await json('backend/api/schedules.php?admin=1&event_id='+encodeURIComponent(id));items=d.schedule||[];renderItems();}
function typeLabel(t){return ({keynote:'سخنرانی کلیدی',speech:'سخنرانی',panel:'پنل',workshop:'کارگاه',break:'استراحت'})[t]||t||'برنامه';}
function renderItems(){document.getElementById('count').textContent=items.length+' مورد';var box=document.getElementById('items');if(!items.length){box.innerHTML='<div class="muted">برای این همایش هنوز برنامه‌ای ثبت نشده است.</div>';return;}box.innerHTML=items.map(function(x){return '<div class="schedule-admin-item"><div><strong>'+esc(x.title)+'</strong><div class="meta"><span><i class="fas fa-calendar"></i> '+esc(x.date||'-')+'</span><span><i class="fas fa-clock"></i> '+esc(x.time||'-')+'</span><span><i class="fas fa-location-dot"></i> '+esc(x.hall||'-')+'</span><span><i class="fas fa-tag"></i> '+esc(typeLabel(x.type))+'</span></div>'+(x.speaker?'<div class="muted">سخنران: '+esc(x.speaker)+'</div>':'')+(x.description?'<div class="muted">'+esc(x.description)+'</div>':'')+'</div><div class="actions"><button class="btn btn-outline btn-sm" onclick="editItem('+x.id+')">ویرایش</button><button class="btn btn-danger btn-sm" onclick="deleteItem('+x.id+')">حذف</button></div></div>';}).join('');}
function editItem(id){var x=items.find(function(a){return a.id===id});if(!x)return;document.getElementById('itemId').value=x.id;document.getElementById('date').value=x.date||'';document.getElementById('startTime').value=(x.startTime||'').slice(0,5);document.getElementById('endTime').value=(x.endTime||'').slice(0,5);document.getElementById('type').value=x.type||'speech';document.getElementById('title').value=x.title||'';document.getElementById('speaker').value=x.speaker||'';document.getElementById('hall').value=x.hall||'';document.getElementById('sortOrder').value=x.sort_order||0;document.getElementById('description').value=x.description||'';document.getElementById('formTitle').textContent='ویرایش برنامه';window.scrollTo({top:document.getElementById('scheduleForm').offsetTop-80,behavior:'smooth'});}
function resetForm(){document.getElementById('itemId').value='';document.getElementById('scheduleForm').reset();document.getElementById('sortOrder').value=0;document.getElementById('formTitle').textContent='افزودن برنامه';}
document.getElementById('eventSelect').addEventListener('change',loadItems);
document.getElementById('scheduleForm').addEventListener('submit',async function(e){e.preventDefault();var id=document.getElementById('itemId').value;var payload={event_id:Number(document.getElementById('eventSelect').value),date:document.getElementById('date').value,startTime:document.getElementById('startTime').value,endTime:document.getElementById('endTime').value,type:document.getElementById('type').value,title:document.getElementById('title').value,speaker:document.getElementById('speaker').value,hall:document.getElementById('hall').value,sort_order:Number(document.getElementById('sortOrder').value||0),description:document.getElementById('description').value};try{await json('backend/api/schedules.php',{method:id?'PATCH':'POST',body:JSON.stringify(id?Object.assign(payload,{id:Number(id)}):payload)});showToast('برنامه با موفقیت ذخیره شد.','success');resetForm();loadItems();}catch(err){showToast(err.message,'error');}});
async function deleteItem(id){if(!confirm('این برنامه حذف شود؟'))return;try{await json('backend/api/schedules.php',{method:'DELETE',body:JSON.stringify({id:id})});showToast('برنامه حذف شد.','success');loadItems();}catch(err){showToast(err.message,'error');}}
(async function(){try{await loadEvents();await loadItems();}catch(e){showToast(e.message,'error');}})();
</script></body></html>
